<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="same-origin">
<title>$title &middot; $site</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v=$version">
</head>
<body data-page="$page" data-refresh="$refresh" data-state="$state" class="app">
<a class="skip" href="#main">Skip to content</a>
<aside class="side" id="side" aria-label="Main navigation">
 <a class="brand" href="/"><img src="/static/logo.svg" alt="" width="32" height="32"><span><b>$site</b><small>Jetson Nano edge AI</small></span></a>
 <nav class="nav">$nav</nav>
 <div class="side-foot"><span class="dot $state"></span><span>$detail</span></div>
</aside>
<div class="shell">
 <header class="topbar">
  <button class="menu-btn" id="menubtn" type="button" aria-controls="side" aria-expanded="false" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <span class="crumb">$site <span aria-hidden="true">/</span> <b>$title</b></span>
  <span id="status" class="pill $state" role="status" aria-live="polite">$detail</span>
  <a class="who-link" href="/account" title="Your account">$who</a>
  <form method="post" action="/logout" class="signout"><input type="hidden" name="csrf" value="@@csrf@@"><button class="btn" type="submit">Sign out</button></form>
 </header>
 <main id="main">
$banner
$flash
$body
 </main>
 <footer>facepipe v$version &middot; recognition runs on this device &middot; page generated $now</footer>
</div>
<dialog id="confirm" class="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-text">
 <h2 id="dlg-title">Please confirm</h2><p id="dlg-text"></p>
 <div class="dlg-actions"><button class="btn" type="button" id="dlg-cancel">Cancel</button><button class="btn primary" type="button" id="dlg-ok">Confirm</button></div>
</dialog>
<script src="/static/app.js?v=$version"></script>
</body>
</html>
