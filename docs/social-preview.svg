      <text x="486" y="386">2 RTSP cameras</text>
      <text x="86" y="458">On-device inference</text>
      <text x="486" y="458">CSV attendance export</text>
    </g>
    <path d="M64 530H1216" fill="none" stroke="#b8c4dc" stroke-opacity="0.25"/>
    <text x="64" y="578" fill="#b8c4dc" font-size="22">hamza-aziz-ai / Jetson-Nano-Face-Recognition-Attendance-System</text>
  </g>
  <rect x="912" y="174" width="304" height="304" rx="36" fill="#050c1a" fill-opacity="0.25"/>
