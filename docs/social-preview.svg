<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Face Attendance on Jetson Nano</title>
  <desc id="description">Real-time face recognition attendance. DeepStream 6 and TensorRT, two RTSP cameras, on-device inference, and CSV attendance export.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.55" stop-color="#13244a"/>
      <stop offset="1" stop-color="#1d3466"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
    <rect x="64" y="70" width="48" height="6" rx="3" fill="#6ea8fe"/>
    <text x="64" y="121" fill="#b8c4dc" font-size="22" font-weight="700" letter-spacing="2">ON-DEVICE FACE RECOGNITION</text>
    <text x="64" y="229" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="-2">Face Attendance</text>
    <text x="64" y="286" fill="#d9e3f5" font-size="24">Real-time face recognition attendance on a Jetson Nano</text>
    <g fill="#ffffff" stroke="#e4e7ec">
      <rect x="64" y="350" width="384" height="56" rx="12"/>
      <rect x="464" y="350" width="356" height="56" rx="12"/>
      <rect x="64" y="422" width="384" height="56" rx="12"/>
      <rect x="464" y="422" width="356" height="56" rx="12"/>
    </g>
    <g fill="#13244a" font-size="22" font-weight="700">
